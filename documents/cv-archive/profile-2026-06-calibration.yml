narrative:
  # Primary frame. Leads every piece of outreach. Credentials support; they don't open.
  headline: "The behavioral layer is the new UX. I design how AI systems behave with users."
  # Exit story in Joel's words (condensed; full version in modes/_profile.md).
  # Structure: built it, proved it, peer-reviewed it, now scaling it.
  # NEVER disparage Conviva in outbound material.
  exit_story: >
    I spent the last two years at Conviva building the operating model everyone
    is now trying to hire for. I authored two production behavioral contracts
    governing how our AI systems behave with users: one for Nexa, our
    conversational analytics assistant, and one for our website sales agent. I built the AI-native pipeline where PM and design
    co-author structured specs that go straight to shipped product. We ship
    weekly with no frontend engineering in the pipeline. That work is proven and
    published: I co-authored the peer-reviewed ACM CAIS 2026 paper on Nexa,
    published How to Lead Design in the AI Era, and open-sourced BiModal Design.
    What I can't do at Conviva is scale it.
    I'm looking for a company where defining how AI systems behave with users
    is the core product problem, with VP-level scope and authority. I'm not
    leaving a bad situation. I'm leaving a proven one to run it at the scale
    it deserves.
  superpowers:
    - "Behavioral Contracts: numbered, independently testable specifications governing AI behavior (two in production). NEVER state a clause count."
    - "BiModal Design: open-source framework for interfaces serving humans and AI agents (40-75% agent task completion improvement on WebArena and ST-WebAgentBench)"
    - "AI-Native Builder Model: spec-to-ship pipeline, weekly releases with no frontend engineering; one Builder produces what 5-8 traditional contributors produced"
    - "Global design org leadership: UX, research, and content across three countries (US, India, China)"
    - "Revenue-impact design strategy: $11M ARR product line built; $1M Wayfair deal saved"
  # Proof points: use these numbers, never invent others.
  proof_points:
    - name: "Behavioral Contracts (production methodology)"
      url: "https://ai-plus.design"
      hero_metric: "Two production contracts at Conviva: Nexa, and the website sales agent. Repeatable methodology, not a one-off. NEVER state a clause count."
    - name: "BiModal Design Framework (open source)"
      url: "https://bimodal.design"
      hero_metric: "40-75% improvement in agent task completion across WebArena and ST-WebAgentBench"
    - name: "Nexa: Automatically Surfacing Business Impacting Insights in E-commerce Applications (ACM CAIS 2026)"
      url: "https://doi.org/10.1145/3786335.3813185"
      hero_metric: "Core contributing author (4 of 17, never 'lead author'). Agentic insight-discovery framework (Contrastive Stateful Trajectories); Joel owned the explainability/presentation layer. NOT about Behavioral Contracts — the paper never mentions them (verified full-text 2026-06-12)."
    - name: "Revenue impact at Conviva"
